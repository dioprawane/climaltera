services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Monte le code source pour le hot-reload
      - .:/app
      # Garde node_modules dans le conteneur (évite les conflits Windows/Linux)
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: npm run dev -- --host
