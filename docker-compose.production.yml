services:
  climaltera:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: climaltera
    restart: unless-stopped
    ports:
      - "3600:3600"
    environment:
      - NODE_ENV=production
      - PORT=3600
      - ORIGIN=https://climaltera.com
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3600/"]
      interval: 30s
      timeout: 5s
      retries: 3
